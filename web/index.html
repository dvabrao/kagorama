<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kagorama</title>

<style>
@font-face{font-family:'Press Start 2P';src:url('fonts/press-start-2p.woff2') format('woff2');font-display:swap}
:root{--bg:#05060a;--ink:#ece8d6;--dim:#8e8a7a;--or:#f59e3b;--te:#3bd1c7;--ye:#f2d14b;--gr:#8fd14b;--re:#e8574a}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.02em}
.ov{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:auto;background:rgba(5,6,10,.9);padding:14px 14px 24px;box-sizing:border-box}
.ov.on{display:block}
.wrap{max-width:860px;margin:0 auto}
h1{font-family:"Press Start 2P",monospace;font-size:20px;margin:6px 0 4px;color:var(--ye);text-shadow:3px 3px 0 #b5442f;line-height:1.4}
.sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label.lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
input.name{flex:1;min-width:120px;max-width:240px;background:#12141c;border:2px solid #2a2d3a;color:var(--ink);font-size:16px;padding:8px 10px;border-radius:6px;outline:none}
input.name:focus{border-color:var(--te)}
.seg{display:inline-flex;border:2px solid #2a2d3a;border-radius:8px;overflow:hidden}
.seg button{background:#12141c;color:var(--dim);border:0;padding:9px 11px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--te);color:#04161a;font-weight:700}
.btn{background:#1b1e29;color:var(--ink);border:2px solid #343849;border-radius:8px;padding:10px 12px;font-size:14px;cursor:pointer;font-weight:600}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--or);border-color:var(--or);color:#1d0f02}
.btn.go{background:var(--gr);border-color:var(--gr);color:#0e1a03}
.btn.sm{padding:8px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
#stage.land .grid{grid-template-columns:1fr 1fr}
.card{background:#0e1017;border:2px solid #23263296;border-left:6px solid var(--c);border-radius:10px;padding:12px}
.card h2{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--c);margin:2px 0 8px;line-height:1.4}
.card p{margin:0 0 6px;font-size:13px;line-height:1.4}
.card .ctl{color:var(--dim);font-size:12px}
.card .rec{font-size:12px;color:var(--ye);margin:6px 0}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rank{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.rank li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #2a2d3a}
.rank li span:first-child{color:var(--dim)}
.foot{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.5}
.center{text-align:center}
.center .row{justify-content:center}
.big{font-family:"Press Start 2P",monospace;font-size:26px;color:var(--ye);margin:10px 0}
.stack{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:14px auto}
.ok{color:var(--gr);font-size:13px;min-height:18px}
#pauseBtn{position:absolute;top:4px;right:6px;width:40px;height:34px;display:none;background:rgba(20,22,30,.8);border:2px solid #3a3e50;color:var(--ink);border-radius:8px;font-family:"Press Start 2P",monospace;font-size:12px;z-index:5;touch-action:manipulation}
.help h2{font-family:"Press Start 2P",monospace;font-size:15px;color:var(--c);line-height:1.5;margin:6px 0 10px}
.help h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ye);margin:16px 0 6px}
.help ul{margin:0;padding-left:20px}.help li{margin:5px 0;line-height:1.45;font-size:14px}
.help p{font-size:14px;line-height:1.5;margin:4px 0}
.help .acts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;position:sticky;bottom:0;background:rgba(5,6,10,.95);padding:10px 0}
.credit{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--or);margin-top:8px}
#stage.tab .wrap{max-width:1100px}
#stage.tab h1{font-size:30px}
#stage.tab .sub,#stage.tab .card p,#stage.tab .help li,#stage.tab .help p{font-size:16px}
#stage.tab .card h2{font-size:15px}
#stage.tab .card .ctl,#stage.tab .card .rec{font-size:14px}
#stage.tab .btn{font-size:16px;padding:12px 16px}
#stage.tab .btn.sm{font-size:15px;padding:10px 13px}
#stage.tab .seg button{font-size:15px;padding:11px 14px}
#stage.tab .grid{grid-template-columns:1fr 1fr;gap:14px}
#stage.tab.land .grid{grid-template-columns:1fr 1fr 1fr}
#stage.tab #pauseBtn{width:54px;height:44px;font-size:14px}
#stage.tab .stack{max-width:400px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:4px 0}
.tools{display:flex;gap:6px}
.ib{width:42px;height:40px;border-radius:10px;background:#1b1e29;border:2px solid #343849;color:var(--ink);font-size:18px;cursor:pointer}
.cfg{background:#0e1017;border:2px solid #23263296;border-radius:10px;padding:4px 12px;margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
#stage.land .tiles,#stage.tab .tiles{grid-template-columns:repeat(3,1fr)}
#stage.tab .tiles{gap:14px}
#stage.tab.land .tiles{grid-template-columns:repeat(6,1fr)}
.tile{position:relative;background:#0e1017;border:2px solid #23263296;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile .tap{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:14px 8px 10px;gap:6px;flex:1}
.tile .tap:active{background:#161925}
.tile svg{width:68px;height:68px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,#0b0d14);padding:6px;box-sizing:border-box}
#stage.tab .tile svg{width:92px;height:92px}
.tile .tn{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--c);text-align:center;line-height:1.5}
#stage.tab .tile .tn{font-size:12px}
.tile .tr{font-size:11px;color:var(--dim)}
.tile .q{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#1b1e29;border:1.5px solid #343849;color:var(--dim);font-weight:700;font-size:14px;cursor:pointer;z-index:1}
.tile .cont{all:unset;cursor:pointer;text-align:center;background:var(--gr);color:#0e1a03;font-weight:700;font-size:12px;padding:8px 4px}
#stage.tab .tile .cont{font-size:14px;padding:10px}
.foot{text-align:center}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" aria-label="Pausar">II</button>

  <div class="ov on" id="ovMenu"><div class="wrap">
    <div class="top"><h1>KAGORAMA</h1>
      <div class="tools"><button class="ib" id="sndBtn" aria-label="Som"></button><button class="ib" id="cfgBtn" aria-label="Ajustes">⚙</button></div></div>
    <div class="cfg" id="cfg" hidden>
      <div class="row"><label class="lbl" for="pname">Jogador</label><input class="name" id="pname" maxlength="16" autocomplete="off"></div>
      <div class="row"><label class="lbl">Tela</label><div class="seg orient"></div><button class="btn sm" id="fsBtn">⛶ Tela cheia</button></div>
    </div>
    <div class="tiles" id="cards"></div>
    <div class="foot" id="foot"></div>
  </div></div>

  <div class="ov" id="ovPause"><div class="wrap center">
    <div class="big">PAUSA</div>
    <div class="row"><label class="lbl">Tela</label><div class="seg orient"></div></div>
    <div class="stack">
      <button class="btn go" data-p="resume">▶ Continuar</button>
      <button class="btn" data-p="save">💾 Salvar progresso</button>
      <button class="btn pri" data-p="saveExit">💾 Salvar e voltar ao menu</button>
      <button class="btn" data-p="help">📖 Como jogar</button>
      <button class="btn" data-p="restart">↺ Reiniciar</button>
      <button class="btn" data-p="exit">✕ Sair sem salvar</button>
    </div>
    <div class="ok" id="pauseMsg"></div>
  </div></div>

  <div class="ov" id="ovHelp"><div class="wrap help" id="helpBody"></div></div>
  <div class="ov" id="ovOver"><div class="wrap center" id="overBody"></div></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
let SW=0,SH=0,W=800,H=450,K=1,rot=false,isLand=true;
const dpr=Math.min(2,window.devicePixelRatio||1);
const ptrs=new Map(), keys={};
let state='menu', cur=null, last=0, flashTxt='', flashT=0, readyT=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FONT='"Press Start 2P",monospace';

/* ---------- armazenamento ---------- */
const LS='kagorama-v1';
const S={name:'Jogador',orient:'auto',sound:true,vol:3,saves:{},scores:{},updated:0};
function lsGet(){try{const t=localStorage.getItem(LS)||localStorage.getItem('dva-fliperama-v1');if(t)Object.assign(S,JSON.parse(t));}catch(e){}
  delete S.saves.rocks;delete S.scores.rocks;S.seen=S.seen||{};}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
lsGet();if(S.vol==null)S.vol=S.sound===false?0:3;
let dbRef=null, cloudTimer=null, cloudOk=false;
function persist(){
  S.updated=Date.now(); lsSet();
  if(dbRef){clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{
    try{await dbRef.set({json:JSON.stringify(S),updated:S.updated});cloudOk=true;}catch(e){cloudOk=false;}
    renderFoot();},700);}
}
async function initCloud(){
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use)) return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection('data/users/'+id).doc('kagorama');
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    const d=snap&&(typeof snap.data==='function'?snap.data():snap);
    let remoteUpd=0;
    if(d&&d.json){
      const remote=JSON.parse(d.json); remoteUpd=remote.updated||0;
      if(remoteUpd>(S.updated||0)){Object.assign(S,remote);lsSet();layout();if(state==='menu')renderMenu();}
    }
    dbRef=ref; cloudOk=true;
    if((S.updated||0)>remoteUpd) persist();
    renderFoot();
  }catch(e){}
}
function addScore(id,score){
  const l=S.scores[id]||(S.scores[id]=[]);
  const e={n:S.name||'Jogador',s:Math.round(score),d:new Date().toLocaleDateString('pt-BR')};
  l.push(e); l.sort((a,b)=>b.s-a.s); S.scores[id]=l.slice(0,5);
  return S.scores[id].indexOf(e);
}

/* ---------- som ---------- */
/* Efeitos em MP3 (44,1 kHz, 192 kbps) carregados em buffers do Web Audio. */
const SFX=['hit','wall','score','lose','levelup','gameover','brick','metal','laser','explode_s','explode_l','step','bonus','click','launch','alarm','crash','pass','extralife','fuel','engine','jet','ufo','offroad','heli','pum1','pum2','pum3','pum4','pum5','pum6','diarrhea','plop','splat','flush','sadtrombone','pp_hit','pp_table','pp_roll','applause'];
const LOOPPTS={engine:[0.98,1.96],jet:[1.42,2.84],ufo:[0.99,1.98],offroad:[0.95,1.9],heli:[0.98,1.96]};
let AC=null,MASTER=null;const BUF={};const loops={};let sfxLoaded=0;
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;
    MASTER.connect(comp).connect(AC.destination);setVol();}catch(e){return;}
  SFX.forEach(n=>fetch('sfx/'+n+'.mp3').then(r=>r.arrayBuffer()).then(a=>new Promise((ok,bad)=>AC.decodeAudioData(a,ok,bad)))
    .then(b=>{BUF[n]=b;sfxLoaded++;}).catch(()=>{}));
}
function setVol(){S.sound=(S.vol??3)>0;if(MASTER)MASTER.gain.value=[0,.3,.6,1][S.vol??3];}
function unlockAudio(){initAudio();try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function sfx(name,rate=1,vol=1,pan=0){
  if(!S.sound||!AC||AC.state!=='running')return;const b=BUF[name];if(!b)return;
  try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;s.playbackRate.value=rate;g.gain.value=vol;
    let node=s.connect(g);
    if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);node=node.connect(p);}
    node.connect(MASTER);s.start();}catch(e){}
}
/* Loops contínuos (motor, jato…): o jogo chama setLoop a cada quadro; o que não for chamado some sozinho. */
function setLoop(key,name,rate=1,vol=1){
  if(!AC||!S.sound)return;const b=BUF[name];if(!b)return;
  let l=loops[key];if(l&&l.dying)l=null;
  if(!l){try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;s.loop=true;
      const lp=LOOPPTS[name];if(lp){s.loopStart=lp[0];s.loopEnd=lp[1];}
      g.gain.value=0;s.connect(g).connect(MASTER);s.start(0,lp?lp[0]:0);l=loops[key]={s,g};}catch(e){return;}}
  l.touched=true;const t=AC.currentTime;
  l.s.playbackRate.setTargetAtTime(rate,t,.05);l.g.gain.setTargetAtTime(vol,t,.06);
}
function sweepLoops(){
  for(const k in loops){const l=loops[k];
    if(!l.touched){if(!l.dying){l.dying=true;try{l.g.gain.setTargetAtTime(0,AC.currentTime,.05);l.s.stop(AC.currentTime+.3);}catch(e){}
        setTimeout(()=>{if(loops[k]===l)delete loops[k];},350);}}
    else l.touched=false;}
}
function killLoops(){for(const k in loops){try{loops[k].s.stop();}catch(e){}delete loops[k];}}

/* ---------- tela / orientação ---------- */
function layout(){
  SW=window.innerWidth; SH=window.innerHeight;
  const phys=SW>=SH;
  const want=S.orient==='auto'?phys:S.orient==='landscape';
  rot=want!==phys; isLand=want;
  const w=rot?SH:SW, h=rot?SW:SH;
  stage.style.width=w+'px'; stage.style.height=h+'px';
  stage.style.transform=rot?`translate(${SW}px,0) rotate(90deg)`:'none';
  stage.classList.toggle('land',want);
  const oW=W,oH=H;
  const tab=Math.min(w,h)>=600;stage.classList.toggle('tab',tab);
  K=clamp(Math.min(w,h)*1.1,450,640)/Math.min(w,h); W=w*K; H=h*K;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr/K,0,0,dpr/K,0,0);
  if(cur&&(Math.abs(oW-W)>.5||Math.abs(oH-H)>.5)) cur.resize(oW,oH);
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,200));
function toWorld(e){
  let x=e.clientX,y=e.clientY;
  if(rot){const nx=y,ny=SW-x;x=nx;y=ny;}
  return {x:x*K,y:y*K};
}

/* ---------- entrada ---------- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); unlockAudio();
  const w=toWorld(e);
  ptrs.set(e.pointerId,{x:w.x,y:w.y,px:w.x,py:w.y,sx:w.x,sy:w.y});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(state==='play'&&cur&&cur.onTap&&readyT<=0) cur.onTap(w.x,w.y);
});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const w=toWorld(e);p.x=w.x;p.y=w.y;});
const up=e=>ptrs.delete(e.pointerId);
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  keys[e.key]=true; unlockAudio();
  if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();
  if(e.key==='Escape'||e.key==='p'){if(state==='play')pause();else if(state==='paused')resume();}
  if(e.key===' '&&state==='play'&&cur&&cur.onTap)cur.onTap(W/2,H/2);
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const keyT={ArrowLeft:0,ArrowRight:0,ArrowUp:0,ArrowDown:0};
function tickKeys(dt){for(const k in keyT)keyT[k]=keys[k]?keyT[k]+dt:0;}
/* fator 0..1: começa em 20% e chega a 100% depois de ~0,6 s segurando */
function KF(k){const t=keyT[k];return t<=0?0:.2+.8*clamp((t-.12)/.5,0,1);}
function KX(){return KF('ArrowRight')-KF('ArrowLeft');}

/* ---------- utilidades de desenho ---------- */
const stars=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),s:Math.random()<.15?2:1,t:Math.random()*6}));
function drawStars(t){
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(t/700+s.t);ctx.fillStyle='#cfd6ff';ctx.fillRect(s.x*W,s.y*H,s.s*1.4,s.s*1.4);}
  ctx.globalAlpha=1;
}
function text(t,x,y,size,col,align='center'){ctx.font=size+'px '+FONT;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function flash(t){flashTxt=t;flashT=1.8;sfx('levelup')}
const TOP=34; // altura do placar

/* =========================================================
   PINGUE-PONGUE
   ========================================================= */
const pong={
  id:'pong',name:'PINGUE-PONGUE',color:'#3bd1c7',
  desc:'Rebata a bola contra o computador. Faça 7 pontos para subir de nível; se o computador fizer 7, acabou.',
  ctrl:'Arraste o dedo para mover sua raquete.',
  start(sv){this.level=sv?sv.level:1;this.score=sv?sv.score:0;this.ps=sv?sv.ps:0;this.cs=sv?sv.cs:0;this.lives=null;
    this.dims();this.pv=this.mid();this.cv=this.mid();this.err=0;this.serve(1);},
  dims(){this.land=W>=H;this.L=this.land?W:H;this.S=this.land?H:W;this.vmin=this.land?TOP:0;this.len=(this.S-this.vmin)*.2;this.pu=46;this.cu=this.L-46;},
  mid(){return (this.vmin+this.S)/2;},
  serve(dir){this.bu=this.L/2;this.bv=this.mid();const sp=this.L*.42*(1+.07*(this.level-1));const a=rnd(-.45,.45);
    this.du=Math.cos(a)*sp*dir;this.dv=Math.sin(a)*sp;this.wait=.9;this.bounced=false;},
  resize(){const oL=this.L,oS=this.S,ov=this.vmin;this.dims();const fu=this.L/oL;
    const fv=v=>this.vmin+(v-ov)*(this.S-this.vmin)/(oS-ov);
    this.bu*=fu;this.du*=fu;this.bv=fv(this.bv);this.dv*=(this.S-this.vmin)/(oS-ov);this.pv=fv(this.pv);this.cv=fv(this.cv);},
  update(dt){
    let tv=null;for(const p of ptrs.values())tv=this.land?p.y:p.x;
    if(tv!==null)this.pv+=(tv-this.pv)*Math.min(1,dt*25);
    const ks=(this.S)*.95*dt;
    this.pv+=ks*(Math.max(KF('ArrowDown'),KF('ArrowRight'))-Math.max(KF('ArrowUp'),KF('ArrowLeft')));
    const h2=this.len/2;this.pv=clamp(this.pv,this.vmin+h2,this.S-h2);
    const cs=(this.S-this.vmin)*(.5+.12*this.level);
    const tgt=this.du>0?this.bv+this.err:this.mid();
    this.cv+=clamp(tgt-this.cv,-cs*dt,cs*dt);this.cv=clamp(this.cv,this.vmin+h2,this.S-h2);
    if(this.wait>0){this.wait-=dt;return;}
    const r=7, steps=Math.max(1,Math.ceil(Math.hypot(this.du,this.dv)*dt/5));
    for(let i=0;i<steps;i++){
      const h=dt/steps;this.bu+=this.du*h;this.bv+=this.dv*h;
      if(this.bv<this.vmin+r){this.bv=this.vmin+r;this.dv=Math.abs(this.dv);sfx('pp_table',1.15,.45);}
      if(this.bv>this.S-r){this.bv=this.S-r;this.dv=-Math.abs(this.dv);sfx('pp_table',1.15,.45);}

    const fr=performance.now()/60;
    for(const e of this.ents){const y=this.sy(e.d);if(y<TOP-30||y>H+30)continue;const x=e.x,dir=e.vx<0?-1:1;
      if(e.t==='bridge'){const b=this.banks(e.d);ctx.fillStyle='#8a6b3a';ctx.fillRect(b.L-6,y-10,b.R-b.L+12,20);
        ctx.fillStyle='#f2d14b';for(let xx=b.L;xx<b.R;xx+=12)ctx.fillRect(xx,y-10,6,4),ctx.fillRect(xx+6,y+6,6,4);}
      else if(e.t==='ship'){ctx.fillStyle='#1d1f26';ctx.beginPath();ctx.moveTo(x-23*dir,y-5);ctx.lineTo(x+16*dir,y-5);ctx.lineTo(x+23*dir,y);ctx.lineTo(x+16*dir,y+6);ctx.lineTo(x-23*dir,y+6);ctx.fill();
        ctx.fillStyle='#ece8d6';ctx.fillRect(x-14,y-10,16,6);ctx.fillStyle='#e8574a';ctx.fillRect(x-4,y-14,4,5);}
      else if(e.t==='heli'){ctx.fillStyle='#c9b13a';ctx.beginPath();ctx.ellipse(x,y,11,7,0,0,7);ctx.fill();ctx.fillRect(x-22*dir,y-2,14*dir,4);ctx.fillRect(x-24*dir,y-6,3*dir,10);
        ctx.fillStyle='#1d1f26';const rl=8+12*Math.abs(Math.sin(fr));ctx.fillRect(x-rl,y-10,rl*2,2.5);ctx.fillStyle='#9fd3ff';ctx.fillRect(x+3*dir-(dir<0?6:0),y-4,6,5);}
      else if(e.t==='jet'){ctx.fillStyle='#c8ccd6';ctx.beginPath();ctx.moveTo(x+18*dir,y);ctx.lineTo(x-14*dir,y-4);ctx.lineTo(x-18*dir,y-9);ctx.lineTo(x-12*dir,y);ctx.lineTo(x-18*dir,y+9);ctx.lineTo(x-14*dir,y+4);ctx.closePath();ctx.fill();}
      else if(e.t==='fuel'){for(let k=0;k<4;k++){ctx.fillStyle=k%2?'#ece8d6':'#e8574a';ctx.fillRect(x-11,y-20+k*10,22,10);}
        ctx.font='8px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
        'COMB'.split('').forEach((ch,k)=>{ctx.fillStyle=k%2?'#e8574a':'#ece8d6';ctx.fillText(ch,x,y-15+k*10);});}}
    // tiros
    ctx.fillStyle='#f2d14b';for(const s of this.shots){const y=this.sy(s.d);ctx.fillRect(s.x-1.5,y-12,3,14);}
    for(const p of this.parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,this.sy(p.d)-2,4,4);}ctx.globalAlpha=1;
    // avião
    if(this.dead<=0&&(this.inv<=0||Math.floor(this.inv*10)%2)){
      const x=this.x,y=PY,tl=this.tilt,wl=15*(1-Math.max(0,-tl)*.45),wr=15*(1-Math.max(0,tl)*.45);
      ctx.fillStyle='#f2d14b';ctx.beginPath();ctx.moveTo(x,y-15);ctx.lineTo(x+3,y-4);ctx.lineTo(x+wr,y+3);ctx.lineTo(x+wr,y+6);ctx.lineTo(x+3,y+4);ctx.lineTo(x+7,y+12);ctx.lineTo(x-7,y+12);ctx.lineTo(x-3,y+4);ctx.lineTo(x-wl,y+6);ctx.lineTo(x-wl,y+3);ctx.lineTo(x-3,y-4);ctx.closePath();ctx.fill();
      ctx.fillStyle='#1d1f26';ctx.fillRect(x-1.5,y-8,3,5);}
    // marcador de combustível
    const gw=Math.min(W*.5,220),gx=(W-gw)/2,gy=H-26;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(gx-30,gy-11,gw+60,22);
    ctx.fillStyle='#2a2d3a';ctx.fillRect(gx,gy-5,gw,10);
    ctx.fillStyle=this.fuel<25?(Math.floor(performance.now()/250)%2?'#e8574a':'#7a2a22'):'#8fd14b';ctx.fillRect(gx,gy-5,gw*this.fuel/100,10);
    text('V',gx-14,gy,10,'#e8574a');text('C',gx+gw+14,gy,10,'#8fd14b');
    ctx.fillStyle='#ece8d6';ctx.fillRect(gx+gw/2-1,gy-7,2,14);
  },
  hud(){return 'TRECHO '+this.level+'   ♥ '+this.lives;},
  save(){return{level:this.level,score:this.score,lives:this.lives};}
};

/* =========================================================
   RALI DE RESISTÊNCIA
   ========================================================= */
const DAYLEN=170,MAXV=420,Z0=55,PP=.86,DZP=Z0*(1/PP-1);
const CARCOL=['#f2d14b','#3bd1c7','#a56bf2','#f26bb5','#8fd14b','#f08a3c','#ece8d6','#4b8ff2'];
const PHASES=[ // fim (fração do dia), nome, céu, grama1, grama2, pista, montanha
  [.30,'dia','#5a8fe0','#3f8f3a','#378034','#6b6b70','#2f5f2c'],
  [.42,'neve','#9fb6d9','#e8eef5','#d3dbe6','#80838b','#a9b4c4'],
  [.52,'pôr do sol','#e0783a','#2f6b2c','#2a612a','#5d5a60','#5a2e4a'],
  [.75,'noite','#05060a','#05060a','#05060a','#0b0c12','#0b0c12'],
  [.87,'neblina','#6e7480','#4a5560','#46505b','#5a5f66','#5c636e'],
  [1.0,'amanhecer','#e8a0b0','#3a7a35','#346f30','#67666c','#6a4a6a']];
const mtn=Array.from({length:48},(_,i)=>.35+.65*Math.abs(Math.sin(i*1.7)*Math.cos(i*.53)));
function drawCar(x,by,w,col,night){
  const h=w*.5;
  if(night){ctx.fillStyle='#e8574a';ctx.fillRect(x-w*.42,by-h*.55,w*.18,h*.16);ctx.fillRect(x+w*.24,by-h*.55,w*.18,h*.16);return;}
  ctx.fillStyle='#111';ctx.fillRect(x-w*.5,by-h*.42,w*.2,h*.42);ctx.fillRect(x+w*.3,by-h*.42,w*.2,h*.42);
  ctx.fillRect(x-w*.46,by-h*1.0,w*.16,h*.3);ctx.fillRect(x+w*.3,by-h*1.0,w*.16,h*.3);
  ctx.fillStyle=col;ctx.fillRect(x-w*.42,by-h*.78,w*.84,h*.5);
  ctx.fillRect(x-w*.3,by-h*1.15,w*.6,h*.4);
  ctx.fillStyle='rgba(20,30,50,.75)';ctx.fillRect(x-w*.24,by-h*1.08,w*.48,h*.22);
  ctx.fillStyle='#e8574a';ctx.fillRect(x-w*.4,by-h*.6,w*.14,h*.12);ctx.fillRect(x+w*.26,by-h*.6,w*.14,h*.12);
}
const enduro={
  id:'enduro',name:'RALI DE RESISTÊNCIA',color:'#e8574a',
  desc:'Corrida de longa distância: ultrapasse a cota de carros antes que o dia acabe, enfrentando neve, pôr do sol, noite e neblina.',
  ctrl:'O carro acelera sozinho · arraste o dedo para os lados para desviar.',
  quota(day){return Math.min(15+day*10,80);},
  start(sv){this.level=sv?sv.level:1;this.score=sv?sv.score:0;this.lives=null;this.passed=sv?sv.passed:0;
    this.target=sv?sv.target:this.quota(this.level);this.dayT=sv?sv.dayT:0;
    this.px=0;this.spd=0;this.pos=0;this.curve=0;this.curveT=2;this.curveTgt=0;this.bump=0;this.mo=0;this.hitT=0;
    this.cars=[];for(let i=0;i<5;i++)this.cars.push(this.newCar(250+i*320));},
  newCar(dz){return{dz,lane:[-.55,0,.55][Math.floor(Math.random()*3)],tl:0,v:rnd(165,235),col:CARCOL[Math.floor(Math.random()*CARCOL.length)],lt:rnd(2,6)};},
  phase(){const f=this.dayT/DAYLEN;return PHASES.find(p=>f<p[0])||PHASES[5];},
  geo(){const hy=TOP+(H-TOP)*(W>H?.38:.42),RW=W>H?W*.36:W*.48;return{hy,RW};},
  cx(p,G){return W/2+this.curve*(1-p)*(1-p)*W*.55-this.px*p*G.RW;},
  resize(){},
  update(dt){
    const ph=this.phase(),snow=ph[1]==='neve';
    let gas=!keys.ArrowDown,dx=0;
    for(const p of ptrs.values())dx+=(p.x-p.px);
    const G=this.geo();
    let steer=dx/(PP*G.RW)*1.1;steer+=KX()*1.1*dt;
    if(snow)steer*=.8;this.px+=steer;
    this.bump-=dt;this.hitT-=dt;
    if(gas&&this.bump<=0)this.spd+=(95-this.spd/MAXV*45)*dt;else this.spd-=(gas?40:110)*dt;
    const off=Math.abs(this.px)>1.05;
    if(off&&this.spd>170)this.spd-=150*dt;
    this.spd=clamp(this.spd,0,MAXV);
    // curvas
    this.curveT-=dt;if(this.curveT<=0){this.curveTgt=Math.random()<.3?0:rnd(-1,1);this.curveT=rnd(3,7);}
    this.curve+=(this.curveTgt-this.curve)*Math.min(1,dt*.6);
    this.px-=this.curve*.42*(this.spd/MAXV)*dt*(snow?1.15:1);
    this.px=clamp(this.px,-1.5,1.5);this.mo+=this.curve*this.spd*dt*.0015;
    this.pos+=this.spd*dt;this.score+=this.spd*dt/12;
    setLoop('engine','engine',.5+(this.spd/MAXV)*1.55,.5);
    if(off&&this.spd>20)setLoop('road','offroad',.7+this.spd/MAXV*.6,.5);
    // carros
    for(let i=0;i<this.cars.length;i++){const c=this.cars[i],prev=c.dz;
      c.dz-=(this.spd-c.v)*dt;c.lt-=dt;if(c.lt<=0){c.tl=clamp(c.lane+rnd(-.5,.5),-.6,.6);c.lt=rnd(2,6);}
      c.lane+=(c.tl-c.lane)*Math.min(1,dt*.8);
      if(prev>=DZP&&c.dz<DZP){this.passed++;this.score+=50;sfx('pass',rnd(.9,1.15),.7);}
      else if(prev<DZP&&c.dz>=DZP){this.passed=Math.max(0,this.passed-1);sfx('pass',.8,.5);}
      if(Math.abs(c.dz-DZP)<5&&Math.abs(c.lane-this.px)<.42&&this.hitT<=0){
        this.spd=Math.min(this.spd,c.v*.75);this.bump=.35;this.hitT=.8;c.dz=DZP+7;
        this.px+=this.px>c.lane?.25:-.25;sfx('crash',1.1,.6);}
      if(c.dz<-45){let z;do{z=rnd(900,1700);}while(this.cars.some(o=>Math.abs(o.dz-z)<120));this.cars[i]=this.newCar(z);}
      else if(c.dz>2400)this.cars[i]=this.newCar(-40);
    }
    // relógio do dia
    const wasOk=this.passed>=this.target;
    this.dayT+=dt;
    if(!wasOk&&this.passed>=this.target)sfx('bonus');
    if(this.dayT>=DAYLEN){
      if(this.passed>=this.target){this.level++;this.score+=1000;this.passed=0;this.target=this.quota(this.level);this.dayT=0;flash('DIA '+this.level);}
      else{gameOver();return;}}
  },
  draw(){
    const G=this.geo(),ph=this.phase(),night=ph[1]==='noite',fog=ph[1]==='neblina',hy=G.hy;
    ctx.fillStyle=ph[2];ctx.fillRect(0,TOP,W,hy-TOP);
    if(night){ctx.fillStyle='#cfd6ff';for(let i=0;i<40;i++)ctx.fillRect((i*97.3+this.mo*30)%W,TOP+(i*53.1)%(hy-TOP),1.5,1.5);}
    // montanhas
    ctx.fillStyle=ph[6];ctx.beginPath();ctx.moveTo(0,hy);
    const span=W/12,off=this.mo*4,base=Math.floor(off),fr=off-base;for(let i=0;i<=13;i++){const k=((base+i)%48+48)%48;ctx.lineTo((i-fr)*span,hy-mtn[k]*(hy-TOP)*.45);}
    ctx.lineTo(W,hy);ctx.fill();
    // pista
    const step=3;
    for(let y=hy;y<H;y+=step){const p=(y-hy)/(H-hy);if(p<.004)continue;
      const z=Z0*(1/p-1),band=Math.floor((z+this.pos)/26)%2,cx=this.cx(p,G),rw=p*G.RW;
      ctx.fillStyle=band?ph[3]:ph[4];ctx.fillRect(0,y,W,step+.6);
      if(night){if(band){ctx.fillStyle='#3a3d4a';ctx.fillRect(cx-rw-rw*.06,y,rw*.06,step+.6);ctx.fillRect(cx+rw,y,rw*.06,step+.6);}continue;}
      ctx.fillStyle=ph[5];ctx.fillRect(cx-rw,y,rw*2,step+.6);
      ctx.fillStyle=band?'#ece8d6':'#e8574a';ctx.fillRect(cx-rw-rw*.07,y,rw*.07,step+.6);ctx.fillRect(cx+rw,y,rw*.07,step+.6);
      if(band){ctx.fillStyle='rgba(236,232,214,.8)';ctx.fillRect(cx-rw*.36-rw*.015,y,rw*.03,step+.6);ctx.fillRect(cx+rw*.36-rw*.015,y,rw*.03,step+.6);}}
    // carros (longe → perto) e o jogador
    const list=this.cars.map(c=>({dz:c.dz,c})).concat([{dz:DZP,me:true}]).sort((a,b)=>b.dz-a.dz);
    for(const it of list){
      if(it.me){const y=hy+PP*(H-hy),w=G.RW*PP*.6,x=W/2+this.curve*(1-PP)*(1-PP)*W*.55;
        const shake=this.bump>0?rnd(-2,2):0;drawCar(x+shake,y,w,'#3bd1c7',false);
        if(night){ctx.fillStyle='rgba(242,209,75,.08)';ctx.beginPath();ctx.moveTo(x-w*.3,y-w*.5);ctx.lineTo(x-w*1.2,hy+(y-hy)*.25);ctx.lineTo(x+w*1.2,hy+(y-hy)*.25);ctx.lineTo(x+w*.3,y-w*.5);ctx.fill();}
        continue;}
      const c=it.c;if(c.dz<-30)continue;const p=1/(1+c.dz/Z0);if(p<.035)continue;
      if(fog&&p<.42)continue;
      const y=hy+p*(H-hy),w=G.RW*p*.6,x=this.cx(p,G)+c.lane*p*G.RW;drawCar(x,y,w,c.col,night);}
    if(fog){const yf=hy+.42*(H-hy),g=ctx.createLinearGradient(0,hy-20,0,yf);g.addColorStop(0,'rgba(140,146,156,.95)');g.addColorStop(1,'rgba(140,146,156,0)');ctx.fillStyle=g;ctx.fillRect(0,hy-20,W,yf-hy+20);}
    // painel inferior: velocidade e relógio
    const kmh=Math.round(this.spd/MAXV*240),f=this.dayT/DAYLEN;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H-30,W,30);
    text(kmh+' km/h',10,H-15,11,'#ece8d6','left');
    const bw=Math.min(W*.42,200),bx=W-bw-12;ctx.fillStyle='#2a2d3a';ctx.fillRect(bx,H-20,bw,10);
    PHASES.forEach((q,i)=>{const a=i?PHASES[i-1][0]:0;ctx.fillStyle=q[2];ctx.fillRect(bx+a*bw,H-20,(q[0]-a)*bw,10);});
    ctx.fillStyle='#ece8d6';ctx.fillRect(bx+f*bw-1.5,H-24,3,18);
    if(this.passed>=this.target)text('✓ COTA BATIDA',W/2,TOP+16,10,'#8fd14b');
  },
  hud(){const r=this.target-this.passed;return 'DIA '+this.level+'  '+(r>0?'FALTAM '+r:'✓');},
  save(){return{level:this.level,score:this.score,passed:this.passed,target:this.target,dayT:this.dayT};}
};

const GAMES={poop,pong,bricks,inv,river,enduro};

/* ---------- fluxo de jogo ---------- */
function showOv(id){$$('.ov').forEach(o=>o.classList.toggle('on',o.id===id));}
function startGame(id,resume){
  const g=GAMES[id];const sv=resume?S.saves[id]:null;
  cur=g;g.fromSave=!!sv;g.savedRun=false;g.start(sv||null);
  ptrs.clear();state='play';readyT=1.3;flashTxt='';flashT=0;
  showOv(null);$('#pauseBtn').style.display='block';unlockAudio();
}
function saveRun(){if(!cur||state==='over'||state==='menu')return;S.saves[cur.id]=Object.assign(cur.save(),{t:Date.now()});cur.savedRun=true;persist();}
function pause(){if(state!=='play')return;state='paused';ptrs.clear();$('#pauseMsg').textContent='';renderOrient();showOv('ovPause');$('#pauseBtn').style.display='none';}
function resume(){state='play';readyT=1;ptrs.clear();showOv(null);$('#pauseBtn').style.display='block';}
function toMenu(){killLoops();state='menu';cur=null;ptrs.clear();$('#pauseBtn').style.display='none';renderMenu();showOv('ovMenu');}
function gameOver(){
  if(state==='over')return;const g=cur;state='over';killLoops();ptrs.clear();$('#pauseBtn').style.display='none';
  if(g.fromSave||g.savedRun)delete S.saves[g.id];
  const pos=addScore(g.id,g.score);persist();
  sfx(g.overSfx||'gameover')
  const list=S.scores[g.id]||[];
  $('#overBody').innerHTML=`<div class="big" style="color:var(--re)">FIM DE JOGO</div>
    <div class="px" style="font-size:12px;color:${g.color};margin-bottom:6px">${g.name}</div>
    <div class="px" style="font-size:22px;margin:10px 0">${fmt(g.score)}</div>
    <div class="ok">${pos===0?'★ NOVO RECORDE! ★':pos>0?'Você entrou no ranking em '+(pos+1)+'º lugar':''}</div>
    <ul class="rank" style="max-width:320px;margin:10px auto">${list.map((e,i)=>`<li${i===pos?' style="color:var(--ye)"':''}><span>${i+1}º ${esc(e.n)} · ${e.d}</span><span>${fmt(e.s)}</span></li>`).join('')}</ul>
    <div class="stack"><button class="btn go" id="again">▶ Jogar de novo</button><button class="btn" id="back">☰ Menu</button></div>`;
  $('#again').onclick=()=>startGame(g.id,false);$('#back').onclick=toMenu;
  setTimeout(()=>{if(state==='over')showOv('ovOver');},700);
}
$('#pauseBtn').addEventListener('click',e=>{e.stopPropagation();pause();});
$('#ovPause').addEventListener('click',e=>{const a=e.target.closest('[data-p]');if(!a)return;const p=a.dataset.p;
  if(p==='resume')resume();
  else if(p==='save'){saveRun();$('#pauseMsg').textContent='✓ Progresso salvo ('+fmt(cur.score)+' pts, nível '+cur.level+')';}
  else if(p==='saveExit'){saveRun();toMenu();}
  else if(p==='help')showHelp(cur.id,'pause');
  else if(p==='restart')startGame(cur.id,false);
  else if(p==='exit')toMenu();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){saveRun();pause();$('#pauseMsg').textContent='✓ Salvo automaticamente';}});
window.addEventListener('pagehide',()=>{if(state==='play'||state==='paused')saveRun();});

let helpCtx=null;
function showHelp(id,from,resume){
  const g=GAMES[id],m=MANUAL[id];helpCtx={id,from,resume};
  const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  $('#helpBody').style.setProperty('--c',g.color);
  $('#helpBody').innerHTML=`<h2>📖 ${g.name}</h2>
    <h3>Objetivo</h3><p>${m.obj}</p>
    <h3>Controles</h3>${li(m.ctl)}
    ${m.extra.map(([t,x])=>`<h3>${t}</h3><p>${x}</p>`).join('')}
    <h3>Pontuação</h3>${li(m.pts)}
    <h3>Dicas</h3>${li(m.tips)}
    ${(S.scores[id]||[]).length?`<h3>🏆 Ranking</h3><ul class="rank">${S.scores[id].map((e,i)=>`<li><span>${i+1}º ${esc(e.n)} · ${e.d}</span><span>${fmt(e.s)}</span></li>`).join('')}</ul>`:''}
    <h3>Pausa e salvar</h3><p>Toque em <b>II</b> para pausar. Na pausa você pode salvar e continuar depois pelo botão <b>Continuar</b> do menu. Se sair do app no meio da partida, o jogo salva sozinho.</p>
    <div class="acts">${from==='pause'?'<button class="btn go" data-h="back">◀ Voltar à pausa</button>':
      `<button class="btn go" data-h="play">▶ Jogar</button><button class="btn" data-h="back">Fechar</button>`}</div>`;
  showOv('ovHelp');$('#ovHelp').scrollTop=0;
}
$('#ovHelp').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b||!helpCtx)return;
  S.seen[helpCtx.id]=1;persist();
  if(b.dataset.h==='play')startGame(helpCtx.id,!!helpCtx.resume);
  else if(helpCtx.from==='pause'){renderOrient();showOv('ovPause');}
  else{renderMenu();showOv('ovMenu');}});

/* ---------- menu ---------- */
function renderOrient(){
  const opts=[['auto','Auto'],['landscape','Paisagem'],['portrait','Retrato']];
  $$('.seg.orient').forEach(el=>{el.innerHTML=opts.map(([v,l])=>`<button data-o="${v}" class="${S.orient===v?'on':''}">${l}</button>`).join('');});
}
document.addEventListener('click',e=>{const b=e.target.closest('.seg.orient button');if(!b)return;
  S.orient=b.dataset.o;persist();layout();renderOrient();
  const want=S.orient==='landscape'?'landscape':S.orient==='portrait'?'portrait':null;
  if(want&&document.fullscreenElement&&screen.orientation&&screen.orientation.lock)screen.orientation.lock(want).catch(()=>{});});

function renderFoot(){
  const el=$('#foot');if(!el)return;
  el.innerHTML=(cloudOk?'☁️ Progresso salvo na sua conta':'📱 Progresso salvo neste aparelho')+'<div class="credit">KAGORAMA v1.0 · by nob</div>';
}
function renderMenu(){
  $('#pname').value=S.name||'';
  $('#sndBtn').textContent=['🔇','🔈','🔉','🔊'][S.vol??3];
  renderOrient();
  $('#cards').innerHTML=Object.values(GAMES).map(g=>{
    const sv=S.saves[g.id],top=(S.scores[g.id]||[])[0];
    return `<div class="tile" style="--c:${g.color}">
      <button class="q" data-g="${g.id}" data-a="help" aria-label="Como jogar">?</button>
      <button class="tap" data-g="${g.id}" data-a="new">${ICONS[g.id]}<div class="tn">${g.name}</div><div class="tr">${top?'🏆 '+fmt(top.s):'&nbsp;'}</div></button>
      ${sv?`<button class="cont" data-g="${g.id}" data-a="cont">⟳ Continuar · nv ${sv.level}</button>`:''}
    </div>`;}).join('');
  renderFoot();
}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.g,a=b.dataset.a;
  sfx('click');
  if(a==='new')startGame(id,false);else if(a==='cont')startGame(id,true);else if(a==='help')showHelp(id,'menu');});
$('#cfgBtn').addEventListener('click',()=>{const c=$('#cfg');c.hidden=!c.hidden;sfx('click');});
$('#pname').addEventListener('change',e=>{S.name=e.target.value.trim().slice(0,16)||'Jogador';persist();});
$('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
$('#sndBtn').addEventListener('click',()=>{S.vol=((S.vol??3)+3)%4;setVol();unlockAudio();persist();$('#sndBtn').textContent=['🔇','🔈','🔉','🔊'][S.vol];setTimeout(()=>sfx('click'),30);});
const fsOk=document.fullscreenEnabled||document.webkitFullscreenEnabled;
if(!fsOk||/KagoramaApp/.test(navigator.userAgent))$('#fsBtn').style.display='none';
$('#fsBtn').addEventListener('click',async()=>{
  try{if(document.fullscreenElement){await document.exitFullscreen();return;}
    await document.documentElement.requestFullscreen();
    const want=S.orient==='landscape'?'landscape':S.orient==='portrait'?'portrait':null;
    if(want&&screen.orientation&&screen.orientation.lock)await screen.orientation.lock(want).catch(()=>{});
  }catch(e){$('#fsBtn').style.display='none';}
});

/* ---------- laço principal ---------- */
function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  tickKeys(dt);
  if(state==='play'&&cur){
    if(readyT>0)readyT-=dt;else cur.update(dt);
    for(const p of ptrs.values()){p.px=p.x;p.py=p.y;}
  }
  sweepLoops();
  if(flashT>0&&state==='play')flashT-=dt;
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  drawStars(t);
  if(cur&&state!=='menu'){
    cur.draw();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,TOP-4);ctx.fillStyle='#1d2130';ctx.fillRect(0,TOP-4,W,2);
    text(fmt(cur.score),10,16,12,'#ece8d6','left');
    text(cur.hud?cur.hud():'NV '+cur.level+'   ♥ '+cur.lives,W/2,16,12,cur.color);
    if(flashT>0)text(flashTxt,W/2,H/2,24,'#f2d14b');
    if(readyT>0&&state==='play')text('PRONTO?',W/2,H/2,20,'#ece8d6');
  }
  requestAnimationFrame(loop);
}
layout();renderMenu();requestAnimationFrame(loop);initCloud();
window.kagoBack=()=>{if(state==='play'){pause();return true;}if(state==='paused'){resume();return true;}
  if($('#ovHelp').classList.contains('on')){$('#ovHelp [data-h=back]').click();return true;}if(state==='over'){toMenu();return true;}return false;};
window.__fliperama={sfx:()=>sfxLoaded,state:()=>state,cur:()=>cur};
})();
